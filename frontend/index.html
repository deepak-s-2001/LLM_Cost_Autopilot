<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Cost Autopilot</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🧭</span>
      <span class="brand-name">Cost Autopilot</span>
    </div>
    <div class="ticker" id="ticker" hidden>
      <span class="ticker-label">Saved this session</span>
      <span class="ticker-value" id="tickerValue">$0.0000</span>
      <span class="ticker-pct" id="tickerPct"></span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <main class="chat" id="chat">
    <div class="empty-state" id="emptyState">
      <h1>Ask it anything.</h1>
      <p>A classifier reads your request, routes it to the cheapest of five models that can actually handle it, and shows its work. Try one:</p>
      <div class="chips" id="chips">
        <button class="chip" data-prompt="What is the capital of Australia?">What is the capital of Australia?</button>
        <button class="chip" data-prompt="Summarize this in two sentences: A mid-size logistics firm automated its warehouse sorting last year, cutting injury rates by a third but also reducing headcount by nearly the same amount, reigniting an internal debate about automation's tradeoffs.">Summarize a short news blurb</button>
        <button class="chip" data-prompt="Given rising customer churn alongside flat revenue growth, propose a retention strategy and justify the tradeoffs of each option you consider.">Propose a retention strategy</button>
        <button class="chip" data-prompt="Compare microservices and a monolith for a 5-person startup team, considering both delivery velocity and operational overhead, then recommend one with reasoning.">Compare two architectures</button>
      </div>
    </div>

    <div class="messages" id="messages"></div>
  </main>

  <form class="composer" id="composer">
    <div class="composer-inner">
      <textarea id="input" placeholder="Message Cost Autopilot…" rows="1" autofocus></textarea>
      <button type="submit" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <p class="composer-hint">The router picks the model — you'll see which one, and what it cost, under each reply.</p>
  </form>

  <template id="messageTemplate">
    <div class="message">
      <div class="bubble"></div>
      <div class="routing-chip" hidden>
        <span class="chip-model"></span>
        <span class="chip-dot">·</span>
        <span class="chip-cost"></span>
        <span class="chip-dot">·</span>
        <span class="chip-latency"></span>
        <details class="chip-details">
          <summary>Why this model</summary>
          <div class="details-panel">
            <p class="details-reason"></p>
            <div class="tier-bars"></div>
            <div class="feature-grid"></div>
          </div>
        </details>
      </div>
    </div>
  </template>

  <template id="revisionTemplate">
    <div class="revision">
      <div class="revision-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
        <span>A stronger model reviewed this and found a better answer</span>
      </div>
      <div class="bubble revision-bubble"></div>
      <p class="revision-meta"></p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
